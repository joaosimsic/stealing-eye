[package]
name = "stealing-eye"
version = "0.1.0"
edition = "2021"

[dependencies]
x11rb = { version = "0.14", features = ["shm", "damage", "composite"] }
libc = "0.2"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
ctrlc = { version = "3", features = ["termination"] }
libpulse-binding = "2"
libpulse-simple-binding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3"
regex = "1"

[profile.release]
lto = true
codegen-units = 1
